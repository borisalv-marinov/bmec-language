services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmec}
      POSTGRES_USER: ${POSTGRES_USER:-bmec}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmec:0.9.1-beta.1
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
      - /app/generated:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    environment:
      BMEC_POSTGRES_URL_FILE: /run/secrets/postgres_url
      BMEC_PORT: "3000"
      BMEC_SECURITY_MODE: ${BMEC_SECURITY_MODE:-production}
      BMEC_AUTH_DEFAULT_POLICY: ${BMEC_AUTH_DEFAULT_POLICY:-role:admin}
      BMEC_ALLOWED_ORIGINS: ${BMEC_ALLOWED_ORIGINS:?Set BMEC_ALLOWED_ORIGINS to the exact public origin}
      BMEC_MAX_BODY_BYTES: ${BMEC_MAX_BODY_BYTES:-1000000}
      BMEC_MAX_HEADER_BYTES: ${BMEC_MAX_HEADER_BYTES:-16384}
    secrets:
      - postgres_url
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BMEC_HOST_BIND_ADDRESS:-127.0.0.1}:${BMEC_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?Set POSTGRES_PASSWORD_SECRET_FILE to a protected file}
  postgres_url:
    file: ${BMEC_POSTGRES_URL_SECRET_FILE:?Set BMEC_POSTGRES_URL_SECRET_FILE to a protected file}
